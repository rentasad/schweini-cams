server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location = / {
        try_files /index.html =404;
    }

    location /cam1/stream {
        proxy_pass http://cam1:8080/stream;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_set_header Host $host;
    }

    location /cam1/snapshot {
        proxy_pass http://cam1:8080/snapshot;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_set_header Host $host;
    }

    location /cam1/state {
        proxy_pass http://cam1:8080/state;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_set_header Host $host;
    }

    location /cam2/stream {
        proxy_pass http://cam2:8080/stream;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_set_header Host $host;
    }

    location /cam2/snapshot {
        proxy_pass http://cam2:8080/snapshot;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_set_header Host $host;
    }

    location /cam2/state {
        proxy_pass http://cam2:8080/state;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_set_header Host $host;
    }
}
