<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Schweini-Kameras</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #111;
      color: #eee;
      font-family: Arial, sans-serif;
      height: 100%;
      overflow: hidden;
    }

    body {
      display: flex;
      flex-direction: column;
    }

    .topbar {
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px;
      background: #1a1a1a;
      border-bottom: 1px solid #2b2b2b;
      box-sizing: border-box;
      flex-shrink: 0;
    }

    .title {
      font-size: 18px;
    }

    .actions {
      display: flex;
      gap: 8px;
    }

    button {
      background: #2d2d2d;
      color: #eee;
      border: 1px solid #444;
      border-radius: 8px;
      padding: 8px 12px;
      cursor: pointer;
      font-size: 14px;
    }

    button:hover {
      background: #3a3a3a;
    }

    .stage {
      position: relative;
      flex: 1;
      min-height: 0;
      padding: 8px;
      box-sizing: border-box;
      background: #111;
    }

    .grid {
      display: grid;
      gap: 8px;
      width: 100%;
      height: 100%;
    }

    .split {
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr;
    }

    .single {
      grid-template-columns: 1fr;
      grid-template-rows: 1fr;
    }

    .cam {
      position: relative;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid #2b2b2b;
      cursor: pointer;
      user-select: none;
    }

    .cam img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      background: #000;
    }

    .label {
      position: absolute;
      left: 10px;
      top: 10px;
      background: rgba(0,0,0,0.55);
      color: #fff;
      padding: 6px 10px;
      border-radius: 8px;
      font-size: 14px;
    }

    .mini {
      position: absolute;
      right: 20px;
      bottom: 20px;
      width: 24%;
      max-width: 340px;
      aspect-ratio: 16 / 9;
      z-index: 10;
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    }

    .hint {
      position: absolute;
      left: 16px;
      bottom: 14px;
      font-size: 13px;
      color: #bbb;
      background: rgba(0,0,0,0.35);
      padding: 6px 10px;
      border-radius: 8px;
      z-index: 11;
    }

    @media (max-width: 900px) {
      .split {
        grid-template-columns: 1fr;
        grid-template-rows: 1fr 1fr;
      }

      .mini {
        width: 38%;
      }

      .title {
        font-size: 16px;
      }
    }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="title">Schweini-Kameras</div>
    <div class="actions">
      <button id="splitBtn">Splitview</button>
    </div>
  </div>

  <div class="stage">
    <div id="view" class="grid split"></div>
    <div class="hint">Klick auf eine Kamera zum Vergrößern. Doppelklick zurück zur Splitview.</div>
  </div>

  <script>
    const cams = [
      { id: "cam1", name: "Kamera 1", stream: "/cam1/stream" },
      { id: "cam2", name: "Kamera 2", stream: "/cam2/stream" }
    ];

    const view = document.getElementById("view");
    const splitBtn = document.getElementById("splitBtn");

    let mode = "split";
    let activeCam = "cam1";

    function makeCamTile(cam, extraClass = "") {
      const wrap = document.createElement("div");
      wrap.className = `cam ${extraClass}`.trim();
      wrap.dataset.camId = cam.id;

      const img = document.createElement("img");
      img.src = cam.stream;
      img.alt = cam.name;
      img.loading = "eager";

      const label = document.createElement("div");
      label.className = "label";
      label.textContent = cam.name;

      wrap.appendChild(img);
      wrap.appendChild(label);

      wrap.addEventListener("click", () => {
        if (mode === "split") {
          activeCam = cam.id;
          mode = "single";
          render();
        } else {
          if (cam.id !== activeCam) {
            activeCam = cam.id;
            render();
          }
        }
      });

      return wrap;
    }

    function renderSplit() {
      view.innerHTML = "";
      view.className = "grid split";

      cams.forEach(cam => {
        view.appendChild(makeCamTile(cam));
      });
    }

    function renderSingle() {
      view.innerHTML = "";
      view.className = "grid single";

      const active = cams.find(c => c.id === activeCam);
      const others = cams.filter(c => c.id !== activeCam);

      const big = makeCamTile(active);
      big.addEventListener("dblclick", () => {
        mode = "split";
        render();
      });

      view.appendChild(big);

      if (others.length > 0) {
        const mini = makeCamTile(others[0], "mini");
        view.appendChild(mini);
      }
    }

    function render() {
      if (mode === "split") {
        renderSplit();
      } else {
        renderSingle();
      }
    }

    splitBtn.addEventListener("click", () => {
      mode = "split";
      render();
    });

    render();
  </script>
</body>
</html>
